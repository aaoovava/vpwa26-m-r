version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: vpwa-chat-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vpwa_user
      POSTGRES_PASSWORD: vpwa_password
      POSTGRES_DB: vpwa_chat
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: